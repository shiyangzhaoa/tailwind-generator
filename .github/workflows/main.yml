name: CI
on:
  push:
    # Release tags are created after the release workflow has run CI.
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      coverage:
        description: "'skip' to run without uploading coverage."
        type: string
        default: skip
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Node.js and pnpm
        uses: jdx/mise-action@v4
      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated mappings and TypeScript
        run: |
          npm run check:mappings
          npm run verify:mappings
          npm run typecheck
      - name: Run tests and collect coverage
        run: npm run test
      - name: Build and verify published entry points
        run: |
          npm run build
          npm run test:package
      - name: Check browser equivalence
        run: |
          pnpm exec playwright install --with-deps chromium
          npm run test:browser
      - name: Upload coverage to Codecov
        # Releases call this workflow without secrets; pushes and PRs upload.
        if: inputs.coverage != 'skip'
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: shiyangzhaoa/tailwind-generator

  # The oldest runtimes in package.json "engines"; Node 24 is covered above.
  consumers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.0', '22.12.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Node.js and pnpm
        uses: jdx/mise-action@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: npm run build
      - name: Install the consumer runtime
        run: mise install node@${{ matrix.node }}
      - name: Import and require the packed package on Node ${{ matrix.node }}
        run: CONSUMER_NODE="$(mise where node@${{ matrix.node }})/bin/node" npm run test:package
