name: Release
# Pull requests add changesets with `pnpm changeset`. On main (stable) and next
# (pre mode, beta), this workflow opens the "Version Packages" pull request
# while changesets are pending, and publishes the version once it is merged.
# See "Releasing" in README.md.
on:
  push:
    branches: [main, next]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - id: select
        uses: changesets/action/select-mode@v2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

  # Publishing is ours rather than changesets/action/publish: the dist-tag is
  # derived from the version, and npm publish is known to support OIDC.
  plan:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.channel.outputs.version }}
      tag: ${{ steps.channel.outputs.tag }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Choose the npm dist-tag
        id: channel
        run: node scripts/release-channel.mts
      - name: Require stable releases to come from main
        if: steps.channel.outputs.prerelease == 'false' && github.ref_name != 'main'
        run: |
          echo "::error::Stable ${{ steps.channel.outputs.version }} must be released from main, not ${{ github.ref_name }}."
          exit 1

  ci:
    needs: plan
    uses: ./.github/workflows/main.yml

  package:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - name: Pack the tarball that will be published
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    needs: [plan, ci, package]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/tailwind-generator/v/${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      # npm trusted publishing (OIDC); no NPM_TOKEN is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Publish to npm
        # ./ makes npm read a local tarball; dist/x.tgz is GitHub shorthand.
        run: npm publish ./dist/*.tgz --tag "${{ needs.plan.outputs.tag }}" --provenance

  github-release:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          LATEST: ${{ needs.plan.outputs.tag == 'latest' }}
        run: |
          # The CHANGELOG.md section that changesets wrote for this version.
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / { found = 0 } found' \
            CHANGELOG.md > notes.md
          flags=(--target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md "--latest=$LATEST")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/*.tgz "${flags[@]}"
