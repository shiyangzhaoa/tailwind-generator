name: Release
# Push a tag created by `npm version`: v1.2.3 publishes to latest,
# v1.2.3-beta.0 to beta. See "Releasing" in README.md.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.channel.outputs.version }}
      tag: ${{ steps.channel.outputs.tag }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Choose the npm dist-tag
        id: channel
        run: node scripts/release-channel.mts
      - name: Require stable releases to come from main
        if: steps.channel.outputs.prerelease == 'false'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; stable releases must be merged first."
            exit 1
          fi

  ci:
    needs: plan
    uses: ./.github/workflows/main.yml

  package:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - name: Pack the tarball that will be published
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    needs: [plan, ci, package]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/tailwind-generator/v/${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      # npm trusted publishing (OIDC); no NPM_TOKEN is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Publish to npm
        run: npm publish dist/*.tgz --tag "${{ needs.plan.outputs.tag }}" --provenance

  github-release:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          LATEST: ${{ needs.plan.outputs.tag == 'latest' }}
        run: |
          flags=(--verify-tag --generate-notes "--latest=$LATEST")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${flags[@]}"
